name: CI

on:
  push:
    branches: [main, dev, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck-and-test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    defaults:
      run:
        working-directory: dashboard/client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run e2e
        env:
          CI: true

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: typecheck-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Pi
    runs-on: self-hosted
    needs: [typecheck-and-test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Pull latest main
        run: git -C "$HOME/bastion-homelab" pull origin main

      - name: Rebuild and restart dashboard
        run: |
          cd "$HOME/docker-hub"
          docker compose up -d --build bastion-dashboard
